# From the repo root:
#   docker compose up --build
#
# Frontend: http://localhost:5173
# Backend:  http://localhost:8000  (docs at /docs)

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      UPLOAD_DIR: /uploads
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - uploads:/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle. The browser calls the API on the host, not over the compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
